[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixtext"
version = "0.1.0"
description = "Glyph-conditioned local text refinement in pixel space"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy==2.2.6",
    "Pillow==13.0.0",
    "opencv-python-headless==5.0.0.93",
    "safetensors>=0.4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
pixtext = "pixtext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and local release model packages"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
files = ["src/pixtext/types.py", "src/pixtext/loading.py", "src/pixtext/cli.py", "src/pixtext/pipeline.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
